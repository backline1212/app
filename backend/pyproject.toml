[project]
name = "backline-backend"
version = "0.1.0"
description = "Backline API - FastAPI backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "motor==3.6.0",
  "redis==5.2.1",
  "arq==0.26.3",
  "httpx==0.28.1",
  "python-jose[cryptography]==3.3.0",
  "cryptography==49.0.0",
  "boto3==1.35.74",
  "resend==2.5.1",
  "python-multipart==0.0.19",
  "google-auth==2.36.0",
  "email-validator==2.2.0",
  "sentry-sdk[fastapi]==2.19.2",
  # Imported directly by modules/assets/service.py (PdfReader) but never declared here -
  # it only stayed resolvable because some other dependency pulled it in transitively.
  # Regenerating uv.lock below to fix the playwright/google-genai gap silently dropped
  # it from the resolution entirely, which would have broken PDF asset handling.
  "pypdf==6.17.0",
  # Capped below 12.0.0: google-genai==0.3.0 requires pillow<12.0.0, and uv.lock
  # simply never included google-genai (or playwright, below) at all rather than
  # error - `uv sync --frozen` installed whatever the last successful lock had and
  # silently skipped both, so this conflict shipped to prod undetected.
  "pillow==11.3.0",
  "google-genai==0.3.0",
  # modules/browser_render: real Chromium/WebKit/Firefox headless rendering for the
  # "Capture As" dropdown. Only imported lazily inside browser_render/service.py's
  # run_render(), so the API process never pays its import cost - but the *browser
  # binaries* (`playwright install chromium firefox webkit`) must still be present
  # wherever render_browser_snapshot_job actually runs (see backend/Dockerfile).
  "playwright==1.49.1",
  # Official Model Context Protocol SDK - powers the Backline-hosted MCP server that
  # wraps the personal-access-token-authenticated generate-prompt endpoint
  # (docs/implementation/slack-ai-mcp-architecture.md §2).
  "mcp==1.12.4",
]

[dependency-groups]
dev = [
  "ruff==0.8.3",
  "mypy==1.13.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.28.1",
  "types-python-jose==3.3.4.20240106",
  "boto3-stubs[s3]==1.35.74",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default-value is the framework's intended dependency
# injection idiom, not the mutable-default-argument bug this rule otherwise catches.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
# playwright ships its own inline types once actually installed (`uv sync` /
# `playwright install`) - this override only covers a checkout where that hasn't
# happened yet, so modules/browser_render's lazy import still type-checks either way.
module = "playwright.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
