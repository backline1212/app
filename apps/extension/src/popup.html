<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backline</title>
    <style>
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }
      main {
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: #555;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 4px;
        background: #0052cc;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #0052cc;
        border: 1px solid #0052cc;
      }
      button.danger {
        background: transparent;
        color: #c0392b;
        border: 1px solid transparent;
        font-weight: 400;
      }
      #status {
        min-height: 16px;
        font-size: 12px;
        color: #c0392b;
        margin-bottom: 8px;
      }
      #connected-view,
      #disconnected-view {
        display: none;
      }
      .workspace-name {
        font-weight: 600;
      }
      hr {
        border: none;
        border-top: 1px solid #eee;
        margin: 12px 0;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #888;
        margin: 0 0 8px;
      }
      #activity-list {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
        max-height: 160px;
        overflow-y: auto;
      }
      #activity-list li {
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      #activity-list li:last-child {
        border-bottom: none;
      }
      .activity-author {
        font-weight: 600;
        font-size: 12px;
      }
      .activity-body {
        font-size: 12px;
        color: #333;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #activity-empty {
        font-size: 12px;
        color: #777;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Backline</h1>

      <div id="disconnected-view">
        <p>Connect your Backline account to leave comments on any site.</p>
        <form id="connect-form">
          <input id="token-input" type="password" placeholder="Paste your extension token" required />
          <button type="submit">Connect</button>
        </form>
        <p id="status"></p>
        <button type="button" class="secondary" id="get-token-link">Get a token</button>
      </div>

      <div id="connected-view">
        <p>
          Connected as <span id="connected-email"></span> to
          <span class="workspace-name" id="connected-workspace"></span>
        </p>
        <button type="button" id="activate-point-btn" style="margin-bottom: 8px;">Add comment</button>
        <button type="button" id="activate-region-btn" class="secondary" style="margin-bottom: 8px;">
          Draw region
        </button>
        <p id="activate-status" style="font-size: 12px; color: #555; margin-bottom: 8px;"></p>

        <hr />

        <h2>On this site</h2>
        <p id="activity-empty"></p>
        <ul id="activity-list"></ul>
        <button type="button" class="secondary" id="open-dashboard-btn" style="margin-bottom: 8px;">
          Open in dashboard
        </button>

        <button type="button" id="disconnect-btn" class="danger">Disconnect</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
