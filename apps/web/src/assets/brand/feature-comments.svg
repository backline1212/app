<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cm-grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cm-grad2" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#111827"/>
  <!-- Browser mockup -->
  <rect x="35" y="42" width="130" height="116" rx="6" stroke="#334155" stroke-width="1.5" fill="#1e293b"/>
  <!-- Title bar -->
  <rect x="35" y="42" width="130" height="16" rx="6" fill="#1e293b"/>
  <circle cx="48" cy="50" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="58" cy="50" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="68" cy="50" r="3" fill="#22c55e" opacity="0.7"/>
  <!-- Page content -->
  <rect x="43" y="64" width="55" height="6" rx="2" fill="#334155"/>
  <rect x="43" y="76" width="114" height="4" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <rect x="43" y="86" width="100" height="4" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <rect x="43" y="96" width="70" height="4" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <rect x="43" y="110" width="114" height="38" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <!-- Comment pin 1 -->
  <g>
    <circle cx="130" cy="76" r="7" fill="url(#cm-grad2)" opacity="0.2"/>
    <circle cx="130" cy="76" r="5" fill="url(#cm-grad2)"/>
    <text x="128" y="79" font-family="sans-serif" font-weight="700" font-size="7" fill="white">1</text>
  </g>
  <!-- Comment pin 2 -->
  <g>
    <circle cx="80" cy="96" r="7" fill="url(#cm-grad)" opacity="0.2"/>
    <circle cx="80" cy="96" r="5" fill="url(#cm-grad)"/>
    <text x="78" y="99" font-family="sans-serif" font-weight="700" font-size="7" fill="white">2</text>
  </g>
  <!-- Comment pin 3 -->
  <g>
    <circle cx="110" cy="125" r="7" fill="#22c55e" opacity="0.2"/>
    <circle cx="110" cy="125" r="5" fill="#22c55e"/>
    <text x="108" y="128" font-family="sans-serif" font-weight="700" font-size="7" fill="white">3</text>
  </g>
  <!-- Floating comment card -->
  <g transform="translate(128,58)">
    <rect x="0" y="0" width="55" height="35" rx="4" fill="#1e293b" stroke="url(#cm-grad2)" stroke-width="1"/>
    <circle cx="10" cy="10" r="4" fill="url(#cm-grad2)" opacity="0.5"/>
    <line x1="18" y1="8" x2="46" y2="8" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="13" x2="40" y2="13" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="48" y2="22" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="28" x2="35" y2="28" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
