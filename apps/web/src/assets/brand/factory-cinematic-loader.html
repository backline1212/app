<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backline — Factory.ai / Fable Style Cinematic Multi-Sequence Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05070f;
      --surface: #0b0f19;
      --surface-glass: rgba(15, 23, 42, 0.7);
      --purple: #8b5cf6;
      --indigo: #6366f1;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --border: rgba(99, 102, 241, 0.2);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Background Mesh */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Cinematic Loader Master Container */
    #loader-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #loader-screen.hidden {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Glowing Circular Aura behind icons */
    .aura-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(6, 182, 212, 0.15) 50%, transparent 70%);
      filter: blur(40px);
      animation: auraBreathe 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes auraBreathe {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    /* Logo & Icon Morphing Stage */
    .icon-stage {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .morph-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.7) translateY(12px) rotate(-6deg);
      filter: blur(8px);
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .morph-icon.active {
      opacity: 1;
      transform: scale(1) translateY(0) rotate(0deg);
      filter: blur(0px);
    }

    .morph-icon.exit {
      opacity: 0;
      transform: scale(1.25) translateY(-14px) rotate(6deg);
      filter: blur(10px);
    }

    /* Icon Specific Animations */
    .svg-ring-spin {
      animation: spinRing 6s linear infinite;
      transform-origin: center;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    /* Phase Progress Indicator Dots */
    .phase-track {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .phase-pill {
      height: 4px;
      width: 28px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }

    .phase-pill.active {
      width: 48px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
    }

    .phase-pill.done {
      background: var(--indigo);
      opacity: 0.7;
    }

    /* Brand Wordmark & Animated Kinetic Letters */
    .wordmark-container {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .wordmark-char {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #fff;
      display: inline-block;
      transform: translateY(40px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wordmark-char.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Kinetic Command Feed (Factory.ai / Fable command line feed) */
    .terminal-feed {
      width: 420px;
      max-width: 90vw;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      margin-bottom: 28px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .cmd-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }

    .cmd-latency {
      color: var(--cyan);
      font-weight: 600;
    }

    .cmd-text {
      color: #e2e8f0;
      font-weight: 500;
    }

    .cmd-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 700;
      margin-left: auto;
    }

    .cursor-blink {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--cyan);
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Overall Progress Bar */
    .progress-bar-wrap {
      width: 420px;
      max-width: 90vw;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #6366f1, #06b6d4);
      box-shadow: 0 0 16px #06b6d4;
      transition: width 0.3s linear;
    }

    /* Mock App Screen Revealed After Loader Completes */
    #app-workspace {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 10;
      background: #090d16;
    }

    .app-nav {
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
    }

    .app-body {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .app-hero-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 48px 56px;
      max-width: 720px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .btn-replay {
      background: linear-gradient(135deg, var(--purple), var(--indigo));
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 24px;
    }

    .btn-replay:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.7);
    }

    /* Interactive Controller Bar at Top Right */
    .dev-hud {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      z-index: 200;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Master Cinematic Loader Screen -->
  <div id="loader-screen">
    <div class="aura-glow"></div>

    <!-- Icon Morphing Carousel Stage -->
    <div class="icon-stage">
      
      <!-- Icon 1: Precision Scope -->
      <div class="morph-icon" id="icon-0">
        <svg width="110" height="110" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="44" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" class="svg-ring-spin" />
          <circle cx="50" cy="50" r="28" stroke="#06b6d4" stroke-width="2" />
          <line x1="50" y1="12" x2="50" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="50" y1="66" x2="50" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="12" y1="50" x2="34" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <line x1="66" y1="50" x2="88" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <circle cx="50" cy="50" r="6" fill="#38bdf8" />
        </svg>
      </div>

      <!-- Icon 2: DOM Element Wireframe Mesh -->
      <div class="morph-icon" id="icon-1">
        <svg width="110" height="110" viewBox="0 0 100 100" fill="none">
          <rect x="16" y="16" width="68" height="68" rx="12" stroke="#6366f1" stroke-width="3" fill="rgba(99, 102, 241, 0.1)" />
          <rect x="28" y="28" width="44" height="20" rx="6" stroke="#38bdf8" stroke-width="2" fill="rgba(6, 182, 212, 0.15)" stroke-dasharray="4 3" />
          <line x1="28" y1="60" x2="72" y2="60" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
          <line x1="28" y1="70" x2="54" y2="70" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
          <circle cx="72" cy="28" r="5" fill="#22c55e" />
        </svg>
      </div>

      <!-- Icon 3: Realtime Spatial Pin & Pulse -->
      <div class="morph-icon" id="icon-2">
        <svg width="110" height="110" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="38" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
          <circle cx="50" cy="50" r="24" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8" />
          <path d="M 50 18 C 38 18 30 26 30 38 C 30 52 50 78 50 78 C 50 78 70 52 70 38 C 70 26 62 18 50 18 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="2" />
          <circle cx="50" cy="38" r="7" fill="#ffffff" />
          <defs>
            <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9333ea" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Icon 4: Full Backline 3D Master Insignia -->
      <div class="morph-icon" id="icon-3">
        <svg width="120" height="120" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="bubbleFill" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed" />
              <stop offset="50%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
          <path d="M 22 24 C 22 14, 34 8, 50 8 C 66 8, 78 14, 78 24 C 78 34, 70 42, 58 44 L 60 52 L 48 45 C 34 45, 22 36, 22 24 Z" 
                transform="scale(1.2) translate(-8, 8)"
                fill="url(#bubbleFill)" 
                stroke="#ffffff" 
                stroke-width="2.5" 
                filter="drop-shadow(0 0 16px rgba(124, 58, 237, 0.8))" />
          <circle cx="50" cy="46" r="14" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" />
          <line x1="50" y1="36" x2="50" y2="56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <line x1="40" y1="46" x2="60" y2="46" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <circle cx="50" cy="46" r="4" fill="#38bdf8" />
        </svg>
      </div>

    </div>

    <!-- Phase Indicator Pills -->
    <div class="phase-track">
      <div class="phase-pill" id="pill-0"></div>
      <div class="phase-pill" id="pill-1"></div>
      <div class="phase-pill" id="pill-2"></div>
      <div class="phase-pill" id="pill-3"></div>
    </div>

    <!-- Staggered Kinetic Wordmark -->
    <div class="wordmark-container" id="wordmark">
      <span class="wordmark-char">B</span>
      <span class="wordmark-char">A</span>
      <span class="wordmark-char">C</span>
      <span class="wordmark-char">K</span>
      <span class="wordmark-char">L</span>
      <span class="wordmark-char">I</span>
      <span class="wordmark-char">N</span>
      <span class="wordmark-char">E</span>
    </div>

    <!-- Factory.ai Style Kinetic Terminal Stream -->
    <div class="terminal-feed">
      <div class="cmd-line">
        <span class="cmd-latency" id="term-latency">[0.12ms]</span>
        <span class="cmd-text" id="term-text">Calibrating spatial coordinates...</span>
        <span class="cursor-blink"></span>
        <span class="cmd-badge" id="term-badge">OK</span>
      </div>
    </div>

    <!-- Overall Progress Bar -->
    <div class="progress-bar-wrap">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Revealed App Workspace (After load completes) -->
  <main id="app-workspace">
    <nav class="app-nav">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="28" height="28" viewBox="0 0 100 100">
          <path d="M 22 24 C 22 14, 34 8, 50 8 C 66 8, 78 14, 78 24 C 78 34, 70 42, 58 44 L 60 52 L 48 45 C 34 45, 22 36, 22 24 Z" fill="url(#bubbleFill)" stroke="#fff" stroke-width="2" />
        </svg>
        <span style="font-weight: 800; font-size: 16px; letter-spacing: 0.08em;">BACKLINE</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: #94a3b8;">
        <span>Workspace: <strong>Acme QA Fleet</strong></span>
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e;"></span>
      </div>
    </nav>

    <section class="app-body">
      <div class="app-hero-card">
        <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 12px; background: linear-gradient(135deg, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          Welcome to Backline Studio
        </h2>
        <p style="color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
          The spatial visual QA &amp; persistent DOM feedback platform has loaded successfully with zero layout shifts.
        </p>
        <button class="btn-replay" onclick="replayCinematicLoader()">
          ↺ Replay Cinematic Loader
        </button>
      </div>
    </section>
  </main>

  <!-- Dev HUD Controls -->
  <div class="dev-hud">
    <span>Speed:</span>
    <button style="background: none; border: 1px solid #475569; color: #fff; border-radius: 4px; padding: 2px 6px; cursor: pointer;" onclick="setSpeed(1)">1x</button>
    <button style="background: none; border: 1px solid #475569; color: #fff; border-radius: 4px; padding: 2px 6px; cursor: pointer;" onclick="setSpeed(2)">2x</button>
  </div>

  <script>
    const sequenceData = [
      {
        iconIdx: 0,
        latency: "[0.18ms]",
        cmd: "INITIALIZE_SPATIAL_OPTICS // Targeting reticle calibrated",
        badge: "SYNCED"
      },
      {
        iconIdx: 1,
        latency: "[0.42ms]",
        cmd: "INDEX_DOM_HIERARCHY // Computing XPath & CSS selectors",
        badge: "VERIFIED"
      },
      {
        iconIdx: 2,
        latency: "[0.78ms]",
        cmd: "ESTABLISH_SOCKET_MESH // 4 active peers connected",
        badge: "STREAMING"
      },
      {
        iconIdx: 3,
        latency: "[1.12ms]",
        cmd: "BACKLINE_CORE_ARMED // Heuristic recovery engine ready",
        badge: "100% READY"
      }
    ];

    let speedMultiplier = 1;
    let currentStep = 0;

    function setSpeed(s) {
      speedMultiplier = s;
    }

    function runLoaderStep(step) {
      if (step >= sequenceData.length) {
        // Trigger final wordmark and completion exit
        revealWordmark();
        setTimeout(() => {
          document.getElementById('progress-fill').style.width = '100%';
          setTimeout(() => {
            document.getElementById('loader-screen').classList.add('hidden');
          }, 450 / speedMultiplier);
        }, 300 / speedMultiplier);
        return;
      }

      const item = sequenceData[step];

      // Update Phase Pills
      for (let i = 0; i < 4; i++) {
        const pill = document.getElementById(`pill-${i}`);
        pill.className = 'phase-pill';
        if (i < step) pill.classList.add('done');
        if (i === step) pill.classList.add('active');
      }

      // Update Icons with Exit / Active classes
      for (let i = 0; i < 4; i++) {
        const icon = document.getElementById(`icon-${i}`);
        if (i === step) {
          icon.className = 'morph-icon active';
        } else if (i < step) {
          icon.className = 'morph-icon exit';
        } else {
          icon.className = 'morph-icon';
        }
      }

      // Update Command Stream
      document.getElementById('term-latency').innerText = item.latency;
      document.getElementById('term-text').innerText = item.cmd;
      document.getElementById('term-badge').innerText = item.badge;

      // Update Progress bar
      const progressPercent = ((step + 1) / (sequenceData.length + 1)) * 100;
      document.getElementById('progress-fill').style.width = `${progressPercent}%`;

      // Schedule Next Step (each step lasts ~850ms)
      setTimeout(() => {
        runLoaderStep(step + 1);
      }, 850 / speedMultiplier);
    }

    function revealWordmark() {
      const chars = document.querySelectorAll('.wordmark-char');
      chars.forEach((c, idx) => {
        setTimeout(() => {
          c.classList.add('show');
        }, idx * (50 / speedMultiplier));
      });
    }

    function replayCinematicLoader() {
      document.getElementById('loader-screen').classList.remove('hidden');
      document.getElementById('progress-fill').style.width = '0%';
      document.querySelectorAll('.wordmark-char').forEach(c => c.classList.remove('show'));
      
      setTimeout(() => {
        runLoaderStep(0);
      }, 150);
    }

    // Auto-start on load
    window.addEventListener('DOMContentLoaded', () => {
      runLoaderStep(0);
    });
  </script>
</body>
</html>
