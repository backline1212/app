name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Lint (ruff)
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        working-directory: backend
        run: uv run mypy app/ scripts/
      - name: Verify generated OpenAPI JSON is current
        working-directory: backend
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../packages/types/openapi.json
      # 06-Backend-Architecture.md §6.4 / Milestone 11: every repository query must be
      # workspace-scoped, or carry a reviewed exemption comment explaining why not. Also
      # covered by tests/test_workspace_scoping_lint.py in the Test step below, but a
      # standalone step surfaces the failure immediately rather than buried in pytest output.
      - name: Workspace-scoping lint
        working-directory: backend
        run: uv run python scripts/check_workspace_scoping.py
      # Milestone 11 hardening: no known critical/high vulnerabilities in backend deps.
      - name: Dependency security audit (pip-audit)
        working-directory: backend
        run: uvx pip-audit
      # GitHub Actions' `services:` block only supports image/env/ports - not a custom
      # command - and MinIO's image requires one (`server /data`), so it's started as a
      # plain background container instead of a service.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=backline-local -e MINIO_ROOT_PASSWORD=backline-local-secret \
            minio/minio server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
      - name: Test
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
          R2_ENDPOINT_URL: http://localhost:9000
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated TypeScript API declarations are current
        run: |
          pnpm --filter @backline/types generate:local
          git diff --exit-code -- packages/types/src/openapi.ts
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Build
        run: pnpm turbo run build
      # 07-Review-SDK.md §7.7 / 19-Testing-CI.md §19.5: SDK bundle must stay under 40KB
      # gzipped - the widget is injected into third-party pages, size directly affects
      # the "comment posted in under 30 seconds" acceptance criterion.
      - name: Check SDK bundle size budget (< 40KB gzipped)
        run: |
          size=$(gzip -c apps/widget/dist/sdk.js | wc -c)
          echo "SDK bundle gzipped size: $size bytes (budget: 40960)"
          if [ "$size" -gt 40960 ]; then
            echo "::error::SDK bundle exceeds the 40KB gzipped budget"
            exit 1
          fi
      # Milestone 11 hardening: no known high/critical vulnerabilities in frontend deps.
      - name: Dependency security audit (pnpm audit)
        run: pnpm audit --audit-level=high

  test-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=backline-local -e MINIO_ROOT_PASSWORD=backline-local-secret \
            minio/minio server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
      - name: Start backend
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
          R2_ENDPOINT_URL: http://localhost:9000
        run: |
          uv run uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          until curl -sf http://localhost:8000/health; do sleep 1; done
      # Lighthouse's Time-to-Interactive budget (19-Testing-CI.md §19.5) means something
      # different against an unbundled dev server than against production output - the
      # frontend must be built and served via `vite preview`, not `vite dev`.
      - name: Build and start frontend (production preview)
        run: |
          pnpm turbo run build
          pnpm --filter @backline/web preview --port 4173 > /tmp/frontend.log 2>&1 &
          until curl -sf http://localhost:4173/; do sleep 1; done
      - name: Run accessibility + performance e2e suite
        working-directory: apps/e2e
        env:
          BACKEND_LOG_PATH: /tmp/backend.log
          WEB_BASE_URL: http://localhost:4173
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  # 18-Storage-Deployment.md §18.8 / 19-Testing-CI.md §19.4: "on pass, Vercel
  # auto-deploys frontend, Railway auto-deploys backend (via GitHub integration, not a
  # custom deploy script) -> smoke test hits /health and a read-only API endpoint
  # post-deploy before marking the deploy healthy." Vercel/Railway's own GitHub App
  # integrations are what actually deploy on a push to main - nothing in this workflow
  # triggers that. This job's only real job is the smoke test gate.
  #
  # Not exercised against real infrastructure: no Vercel/Railway/production account
  # exists for this build (docs/tdr/0011), so PRODUCTION_API_URL is unset and this job
  # currently no-ops rather than failing every merge to main over a secret that can't
  # exist yet - the smoke test script itself (backend/scripts/smoke_test.py) is real
  # and has been run against a live local backend.
  deploy:
    needs: [backend, frontend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        if: ${{ env.HAS_PRODUCTION_API_URL == 'true' }}
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
      - name: Install dependencies
        if: ${{ env.HAS_PRODUCTION_API_URL == 'true' }}
        working-directory: backend
        run: uv sync
      - name: Wait for Vercel/Railway auto-deploy to finish
        if: ${{ env.HAS_PRODUCTION_API_URL == 'true' }}
        run: sleep 60
      - name: Post-deploy smoke test
        if: ${{ env.HAS_PRODUCTION_API_URL == 'true' }}
        working-directory: backend
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: uv run python scripts/smoke_test.py
